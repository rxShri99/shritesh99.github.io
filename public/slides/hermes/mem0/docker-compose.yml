name: mem0-deployment

services:
     postgres:
          image: pgvector/pgvector:pg17
          container_name: mem0-postgres
          restart: unless-stopped
          shm_size: "128mb"
          environment:
               POSTGRES_DB: ${POSTGRES_DB:-postgres}
               POSTGRES_USER: ${POSTGRES_USER:-postgres}
               POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mem0pass}
          healthcheck:
               test:
                    [
                         "CMD-SHELL",
                         "pg_isready -q -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER:-postgres}",
                    ]
               interval: 5s
               timeout: 5s
               retries: 5
          volumes:
               - postgres_db:/var/lib/postgresql/data
               - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
          ports:
               - "${POSTGRES_PORT:-5432}:5432"

     neo4j:
          image: neo4j:5.26.4
          container_name: mem0-neo4j
          restart: unless-stopped
          environment:
               NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-mem0graph}
               NEO4J_PLUGINS: '["apoc"]'
               NEO4J_apoc_export_file_enabled: "true"
               NEO4J_apoc_import_file_enabled: "true"
               NEO4J_apoc_import_file_use__neo4j__config: "true"
          healthcheck:
               test:
                    [
                         "CMD-SHELL",
                         "wget -O /dev/null -q http://localhost:7474 || exit 1",
                    ]
               interval: 10s
               timeout: 10s
               retries: 20
               start_period: 90s
          ports:
               - "${NEO4J_HTTP_PORT:-7474}:7474"
               - "${NEO4J_BOLT_PORT:-7687}:7687"
          volumes:
               - neo4j_data:/data

     mem0:
          image: shritesh99/mem0-selfhost:latest
          container_name: mem0-api
          restart: unless-stopped
          depends_on:
               postgres:
                    condition: service_healthy
               neo4j:
                    condition: service_healthy
          environment:
               POSTGRES_HOST: postgres
               POSTGRES_PORT: 5432
               POSTGRES_DB: ${POSTGRES_DB:-postgres}
               POSTGRES_USER: ${POSTGRES_USER:-postgres}
               POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mem0pass}
               NEO4J_URI: bolt://neo4j:7687
               NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
               NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mem0graph}
               MEM0_LLM_PROVIDER: ${MEM0_LLM_PROVIDER:-lmstudio}
               MEM0_EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:-lmstudio}
               MEM0_LOG_LEVEL: ${MEM0_LOG_LEVEL:-DEBUG}
               LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
               LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-essentialai/rnj-1}
               LMSTUDIO_EMBEDDING_MODEL: ${LMSTUDIO_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v2-moe}
               LMSTUDIO_EMBEDDING_ENCODING_FORMAT: ${LMSTUDIO_EMBEDDING_ENCODING_FORMAT:-float}
          ports:
               - "${MEM0_PORT:-8888}:8000"
          volumes:
               - ./history:/app/history

volumes:
     postgres_db:
     neo4j_data:
